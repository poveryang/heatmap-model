model:
  name: yolo12n_barcode_detector
  task: object_detection
  source_checkpoint: python/runs/det/yolo12n-barcode-det-adamw/weights/best.pt
  onnx_file: yolo12n_barcode_detector.onnx
  onnx_sha256: 1435297875eb26512b09444b9433044a56a39f926051d5b4eda0970912e79b16

input:
  name: images
  dtype: float32
  layout: NCHW
  shape: [1, 3, 640, 640]
  color_order: RGB
  resize: letterbox
  normalize: x / 255.0
  mean: [0.0, 0.0, 0.0]
  scale: [0.0039215686, 0.0039215686, 0.0039215686]

output:
  name: output0
  dtype: float32
  shape: [1, 7, 8400]
  layout: channels_first
  format: [x_center, y_center, width, height, class_scores]
  nms_included: false

classes:
  - id: 0
    name: bar
  - id: 1
    name: qr
  - id: 2
    name: dm

postprocess:
  confidence_threshold: 0.25
  nms_iou_threshold: 0.45
  max_detections: 300

quantization:
  precision: uint8
  calibration_images: calibration/images
  recommended_calibration_count: 512
  tengine_input_shape: 1,3,640,640
  tengine_mean: 0,0,0
  tengine_scale: 0.0039215686,0.0039215686,0.0039215686

evaluation:
  dataset: /home/yjunj/data/barcode_yolo_det
  image_size: 640
  map50: 0.96678
  map50_95: 0.88056
  precision: 0.96598
  recall: 0.93993
  pytorch_validation_speed_ms_per_image:
    preprocess: 0.415
    inference: 0.944
    postprocess: 0.523

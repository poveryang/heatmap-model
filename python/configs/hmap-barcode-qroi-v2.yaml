data:
  root_dir: '/home/yjunj/data/barcode'
  batch_size: 12
  input_size: [ 400, 640 ]
  num_workers: 4
  task: 'geo_qroi'
  quality_path: '/home/yjunj/data/barcode/qroi_labels/roi_quality.v2.jsonl'
  img_aug: false
  geo_aug: false
  viz:
    heatmap_max_images: 16
    qroi_max_images: 16
    # heatmap_manifest: '/home/yjunj/data/barcode/viz/heatmap/manifest.txt'
    # qroi_manifest: '/home/yjunj/data/barcode/viz/qroi/manifest.txt'

model:
  in_channels: 1
  out_channels: 9
  object_classes: 3
  geometry_channels: 6
  enable_qroi: true
  base_channels: 24
  depth: 2
  head_channels: 48
  interpolation: 'nearest'
  gamma: 2.0
  alpha: 0.1
  init_lr: 1e-4
  lambda_geo: 1.0
  lambda_qroi: 1.0
  qroi_pool_size: 7
  qroi_eps: 0.2

wandb:
  enabled: true
  project: 'heatmap-model'
  # entity: optional — omit to use your default W&B account; set only for team projects
  # name: optional — omit to auto-use run directory name

trainer:
  accelerator: 'gpu'
  strategy: 'ddp'
  devices: 4
  precision: '16-mixed'
  max_epochs: 300
  sync_batchnorm: True
  check_val_every_n_epoch: 2

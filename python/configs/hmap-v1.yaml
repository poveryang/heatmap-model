data:
  root_dir: '/newdata/junjieyang/Datasets/barcode'
  batch_size: 16
  input_size: [ 400, 640 ]
  task: 'geo_qroi'
  quality_path:
  img_aug: true
  geo_aug: false

model:
  in_channels: 1
  out_channels: 9
  object_classes: 3
  geometry_channels: 6
  enable_qroi: true
  base_channels: 24
  depth: 2
  head_channels: 48
  interpolation: 'nearest'
  gamma: 2.0
  alpha: 0.1
  init_lr: 1e-4
  lambda_geo: 1.0
  lambda_qroi: 1.0
  qroi_pool_size: 7
  qroi_eps: 0.2

trainer:
  accelerator: 'auto'
  strategy: 'auto'
  devices: 'auto'
  precision: '16-mixed'
  max_epochs: 300
  sync_batchnorm: True
  check_val_every_n_epoch: 2
